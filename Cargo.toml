[package]
name = "repo-utils"
version = "0.4.1"
authors = ["Florian Bramer <elektronenhirn@gmail.com>"]
edition = "2024"
description="Utilities for google's repo-tool"
license="MIT"
readme="README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.99"
chrono = "0.4.41"
clap = {version = "4.5.46", features = ["cargo", "derive"] }
colored = "3.0.0"
crossbeam = "0.8.4"
cursive = {version="0.21.1", features = ["toml"] }
dialoguer = "0.12.0"
git2 = "0.21"
indicatif = { version = "0.18.0", features = ["rayon"] }
quick-xml = { version = "0.42.0", features = ["serialize", "overlapped-lists"] }
rayon = "1.11.0"
serde = {version = "1.0", features = ["derive"]}
tempfile = "3.27.0"
toml = "1.1"
